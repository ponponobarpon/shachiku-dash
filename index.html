<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>社畜ダッシュ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  touch-action: none;
}

body {
  background: #111;
}

#game {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background:
    linear-gradient(
      to bottom,
      #dff3ff 0%,
      #dff3ff 60%,
      #79b957 60%,
      #79b957 100%
    );
}

/* 道路 */

#road {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 40%;
  background: #555;
}

#road::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 48%;
  height: 7px;

  background:
    repeating-linear-gradient(
      90deg,
      #fff 0px,
      #fff 70px,
      transparent 70px,
      transparent 140px
    );
}

/* HUD */

#hud {
  position: absolute;
  z-index: 20;

  top: 12px;
  left: 0;
  right: 0;

  display: flex;
  justify-content: space-between;

  padding: 0 16px;

  font-size: 18px;
  font-weight: 900;

  color: #111;
  text-shadow: 0 1px #fff;
}

/* タイトル */

#title {
  position: absolute;

  top: 18%;
  left: 50%;

  width: 92%;

  transform: translateX(-50%);

  text-align: center;

  z-index: 10;
}

#title h1 {
  margin: 0;

  font-size:
    clamp(38px, 10vw, 68px);

  font-weight: 900;
}

#title p {
  margin-top: 8px;

  font-size:
    clamp(17px, 4.5vw, 25px);

  font-weight: 700;
}

/* キャラクター */

#player,
#boss {
  position: absolute;

  bottom: 40%;

  transform:
    translate(-50%, 50%);

  z-index: 8;
}

#player {
  left: 24%;

  width: 45px;
  height: 58px;

  background: #1976d2;

  border-radius: 12px;
}

#player::before,
#boss::before {
  content: "";

  position: absolute;

  width: 29px;
  height: 29px;

  background: #ffd5b5;

  border-radius: 50%;

  top: -20px;
  left: 8px;
}

#player::after,
#boss::after {
  content: "";

  position: absolute;

  bottom: -8px;
  left: -5px;

  width: 55px;
  height: 10px;

  background: #222;

  border-radius: 10px;
}

#boss {
  right: 13%;

  width: 49px;
  height: 62px;

  background: #222;

  border-radius: 10px;
}

#boss::before {
  left: 10px;
}

/* START */

#start,
#restart {
  border: 0;

  border-radius: 14px;

  background: #ffcc00;

  padding: 15px 42px;

  font-size: 24px;
  font-weight: 900;

  box-shadow:
    0 5px 0 #aa8800;
}

#start {
  position: absolute;

  left: 50%;
  top: 55%;

  transform:
    translate(-50%, -50%);

  z-index: 30;
}

/* 説明 */

#hint {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 5%;

  text-align: center;

  color: #fff;

  font-size: 13px;
  font-weight: 700;

  text-shadow:
    0 1px 3px #000;

  z-index: 15;
}

/* Firebase状態 */

#status {
  position: absolute;

  left: 0;
  right: 0;

  bottom: 12%;

  text-align: center;

  font-size: 13px;
  font-weight: 700;

  z-index: 20;
}

/* ランキング */

#ranking {
  position: absolute;

  top: 55px;
  right: 10px;

  min-width: 160px;

  padding: 10px 12px;

  background: rgba(255,255,255,0.94);

  border-radius: 12px;

  z-index: 25;

  display: none;
}

#ranking h3 {
  margin: 0 0 5px;

  font-size: 15px;
}

#ranking ol {
  margin: 0;

  padding-left: 23px;

  font-size: 13px;
}

/* GAME OVER */

#gameover {
  position: absolute;

  inset: 0;

  background: rgba(0,0,0,0.7);

  z-index: 50;

  display: none;

  color: #fff;

  text-align: center;

  padding-top: 23vh;
}

#gameover h2 {
  margin: 0 0 10px;

  font-size: 42px;
}

#gameover p {
  margin: 8px;

  font-size: 20px;
}

/* 障害物 */

.obstacle {
  position: absolute;

  bottom: 40%;

  width: 32px;
  height: 38px;

  background: #c77935;

  border-radius: 5px;

  z-index: 7;
}

/* コイン */

.coin {
  position: absolute;

  bottom: 40%;

  width: 24px;
  height: 24px;

  background: #ffd21c;

  border: 3px solid #b78d00;

  border-radius: 50%;

  z-index: 7;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div id="game">

  <div id="road"></div>

  <div id="hud">
    <span id="score">0m</span>
    <span id="best">BEST 0m</span>
  </div>

  <div id="title">
    <h1>社畜ダッシュ</h1>
    <p>上司から逃げ続けろ。</p>
  </div>

  <div id="player"></div>

  <div id="boss"></div>

  <button id="start">
    START
  </button>

  <div id="status">
    ランキング接続準備中…
  </div>

  <div id="hint">
    タップ＝ジャンプ　長押し＝高くジャンプ
  </div>

  <div id="ranking">

    <h3>🏆 ランキング</h3>

    <ol id="rankingList"></ol>

  </div>

  <div id="gameover">

    <h2>GAME OVER</h2>

    <p id="finalScore">
      0m
    </p>

    <button id="restart">
      もう一度走る
    </button>

  </div>

</div>


<script type="module">

/* ==================================================
   Firebase
================================================== */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  query,
  orderByChild,
  limitToLast,
  get
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDP7aQ8ylOIiOeLiKfawJVpGUEIt4Dr4e4",

  authDomain:
    "shachiku-dash.firebaseapp.com",

  projectId:
    "shachiku-dash",

  storageBucket:
    "shachiku-dash.firebasestorage.app",

  messagingSenderId:
    "416033862481",

  appId:
    "1:416033862481:web:5e951a935e0d80fdd6d970"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


/* ==================================================
   DOM
================================================== */

const game =
  document.getElementById("game");

const player =
  document.getElementById("player");

const boss =
  document.getElementById("boss");

const scoreEl =
  document.getElementById("score");

const bestEl =
  document.getElementById("best");

const startBtn =
  document.getElementById("start");

const restartBtn =
  document.getElementById("restart");

const statusEl =
  document.getElementById("status");

const ranking =
  document.getElementById("ranking");

const rankingList =
  document.getElementById("rankingList");

const gameover =
  document.getElementById("gameover");

const finalScore =
  document.getElementById("finalScore");

const title =
  document.getElementById("title");

const hint =
  document.getElementById("hint");


/* ==================================================
   GAME STATE
================================================== */

let running = false;

let score = 0;

let best =
  Number(
    localStorage.getItem(
      "shachikuBest"
    )
  ) || 0;

let startTime = 0;

let animationFrame = 0;

let jumping = false;

let jumpStart = 0;

let jumpDuration = 0;

let jumpHeight = 0;

let holding = false;

let holdTimer = null;

let objects = [];

let lastSubmit = 0;


bestEl.textContent =
  `BEST ${best}m`;


/* ==================================================
   JUMP
================================================== */

function jump(high = false) {

  if (!running) return;

  if (jumping) return;

  jumping = true;

  jumpStart =
    performance.now();

  jumpDuration =
    high ? 850 : 600;

  jumpHeight =
    high ? 190 : 115;
}


/* ==================================================
   OBJECT
================================================== */

function spawnObject() {

  const object =
    document.createElement("div");

  const isCoin =
    Math.random() < 0.45;

  object.className =
    isCoin
      ? "coin"
      : "obstacle";

  object.style.left =
    (105 + Math.random() * 15) + "%";

  game.appendChild(object);

  objects.push({

    element: object,

    x:
      105 + Math.random() * 15,

    type:
      isCoin
        ? "coin"
        : "obstacle"

  });
}


/* ==================================================
   CLEAR OBJECT
================================================== */

function clearObjects() {

  for (
    const object
    of objects
  ) {

    object.element.remove();

  }

  objects = [];
}


/* ==================================================
   START
================================================== */

function startGame() {

  running = true;

  score = 0;

  startTime =
    performance.now();

  jumping = false;

  clearObjects();

  gameover.style.display =
    "none";

  startBtn.classList.add(
    "hidden"
  );

  title.classList.add(
    "hidden"
  );

  hint.classList.remove(
    "hidden"
  );

  ranking.style.display =
    "none";

  statusEl.textContent =
    "";

  player.style.transform =
    "translate(-50%,50%)";

  boss.style.right =
    "13%";

  for (
    let i = 0;
    i < 3;
    i++
  ) {

    setTimeout(
      spawnObject,
      i * 1100
    );

  }

  cancelAnimationFrame(
    animationFrame
  );

  animationFrame =
    requestAnimationFrame(
      gameLoop
    );
}


/* ==================================================
   GAME LOOP
================================================== */

function gameLoop(time) {

  if (!running) return;


  score =
    Math.floor(
      (time - startTime) / 1000
    );


  scoreEl.textContent =
    `${score}m`;


  /* 難易度 */

  const difficulty =
    Math.min(
      score / 60,
      1
    );


  /* 障害物追加 */

  if (
    score > 0 &&
    score % 2 === 0 &&
    Math.random() < 0.035
  ) {

    spawnObject();

  }


  /* ジャンプ */

  if (jumping) {

    const progress =
      Math.min(
        (time - jumpStart) /
        jumpDuration,
        1
      );


    const y =
      Math.sin(
        progress * Math.PI
      ) *
      jumpHeight;


    player.style.transform =
      `translate(
        -50%,
        calc(50% - ${y}px)
      )`;


    if (progress >= 1) {

      jumping = false;

      player.style.transform =
        "translate(-50%,50%)";

    }

  }


  /* 上司 */

  const bossProgress =
    Math.min(
      score / 90,
      1
    );


  boss.style.right =
    (13 - bossProgress * 9) +
    "%";


  /* 障害物移動 */

  const playerRect =
    player.getBoundingClientRect();


  for (
    let i = objects.length - 1;
    i >= 0;
    i--
  ) {

    const object =
      objects[i];


    object.x -=
      0.7 +
      difficulty * 0.65;


    object.element.style.left =
      object.x + "%";


    const rect =
      object.element
        .getBoundingClientRect();


    /* 画面外 */

    if (
      object.x < -10
    ) {

      object.element.remove();

      objects.splice(
        i,
        1
      );

      continue;

    }


    /* 衝突 */

    if (

      rect.right >
        playerRect.left &&

      rect.left <
        playerRect.right &&

      rect.bottom >
        playerRect.top + 12 &&

      rect.top <
        playerRect.bottom - 5

    ) {

      if (
        object.type ===
        "coin"
      ) {

        object.element.remove();

        objects.splice(
          i,
          1
        );

        score += 2;

        scoreEl.textContent =
          `${score}m`;

      }

      else {

        endGame();

      }

    }

  }


  /* 上司に捕まる */

  const bossRect =
    boss.getBoundingClientRect();


  if (
    bossRect.left <
    playerRect.right + 8
    &&
    !jumping
  ) {

    endGame();

    return;

  }


  animationFrame =
    requestAnimationFrame(
      gameLoop
    );
}


/* ==================================================
   GAME OVER
================================================== */

function endGame() {

  if (!running) return;

  running = false;

  cancelAnimationFrame(
    animationFrame
  );


  finalScore.textContent =
    `記録 ${score}m`;


  if (
    score > best
  ) {

    best = score;

    localStorage.setItem(
      "shachikuBest",
      best
    );

    bestEl.textContent =
      `BEST ${best}m`;

  }


  gameover.style.display =
    "block";


  submitScore(
    score
  );


  loadRanking();

}


/* ==================================================
   FIREBASE SCORE SAVE
================================================== */

async function submitScore(
  value
) {

  if (
    value <= 0
  ) return;


  if (
    Date.now() -
    lastSubmit <
    1000
  ) return;


  lastSubmit =
    Date.now();


  try {

    const scoresRef =
      ref(
        db,
        "scores"
      );


    const newScore =
      push(
        scoresRef
      );


    await set(
      newScore,
      {

        name:
          "社畜",

        score:
          value,

        createdAt:
          Date.now()

      }
    );


    statusEl.textContent =
      "ランキングに記録しました";


  }

  catch (error) {

    console.error(
      error
    );

    statusEl.textContent =
      "ランキング保存に失敗しました";

  }

}


/* ==================================================
   RANKING
================================================== */

async function loadRanking() {

  try {

    const scoresQuery =
      query(

        ref(
          db,
          "scores"
        ),

        orderByChild(
          "score"
        ),

        limitToLast(
          10
        )

      );


    const snapshot =
      await get(
        scoresQuery
      );


    const rows = [];


    snapshot.forEach(
      child => {

        rows.push(
          child.val()
        );

      }
    );


    rows.sort(
      (a,b) =>
        (b.score || 0) -
        (a.score || 0)
    );


    rankingList.innerHTML =
      "";


    rows.forEach(
      row => {

        const li =
          document.createElement(
            "li"
          );


        li.textContent =
          `${row.name || "社畜"} — ${row.score || 0}m`;


        rankingList.appendChild(
          li
        );

      }
    );


    if (
      rows.length > 0
    ) {

      ranking.style.display =
        "block";

      statusEl.textContent =
        "ランキング接続OK";

    }

    else {

      statusEl.textContent =
        "ランキング接続OK（まだ記録なし）";

    }

  }

  catch (error) {

    console.error(
      error
    );

    statusEl.textContent =
      "ランキング接続エラー";

  }

}


/* ==================================================
   BUTTON
================================================== */

startBtn.addEventListener(
  "click",
  startGame
);


restartBtn.addEventListener(
  "click",
  startGame
);


/* ==================================================
   MOBILE CONTROL
================================================== */

game.addEventListener(
  "pointerdown",
  event => {

    if (
      event.target ===
      startBtn
    ) return;


    if (
      event.target ===
      restartBtn
    ) return;


    if (!running) return;


    holding = true;


    clearTimeout(
      holdTimer
    );


    /*
      一定時間押し続けたら
      高ジャンプ
    */

    holdTimer =
      setTimeout(
        () => {

          if (
            holding
          ) {

            jump(true);

          }

        },
        180
      );

  }
);


game.addEventListener(
  "pointerup",
  () => {

    if (!holding) return;

    holding = false;


    clearTimeout(
      holdTimer
    );


    /*
      短押しなら通常ジャンプ
    */

    if (
      running &&
      !jumping
    ) {

      jump(false);

    }

  }
);


game.addEventListener(
  "pointercancel",
  () => {

    holding = false;

    clearTimeout(
      holdTimer
    );

  }
);


/* ==================================================
   PC KEYBOARD
================================================== */

window.addEventListener(
  "keydown",
  event => {

    if (
      event.code ===
        "Space" ||
      event.code ===
        "ArrowUp"
    ) {

      event.preventDefault();


      if (!running) {

        startGame();

      }

      else {

        jump(true);

      }

    }

  }
);


/* ==================================================
   INITIAL RANKING LOAD
================================================== */

loadRanking();

</script>

</body>
</html>
