*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#78c9ff 0 55%,#d8d8d8 55%)}
#sky{position:absolute;inset:0 0 45%;background:linear-gradient(#6fc5ff,#d9f3ff)}
#road{position:absolute;left:0;right:0;bottom:0;height:45%;background:#555;border-top:8px solid #777}
.lane{position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 35px,#eee 35px 75px);opacity:.7;top:50%}
#hud{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;text-shadow:2px 2px #000}
#boss{position:absolute;z-index:7;left:-120px;bottom:24%;width:105px;height:105px;border-radius:50%;overflow:hidden;border:4px solid #222;background:#fff;box-shadow:0 5px 15px #0008}
#boss img{width:100%;height:100%;object-fit:cover;display:block}
#player{position:absolute;z-index:10;left:40%;bottom:24%;width:52px;height:72px;background:#1769aa;border-radius:16px 16px 8px 8px;box-shadow:0 4px 8px #0008}
#player:before{content:"";position:absolute;width:38px;height:38px;background:#f0c7a8;border-radius:50%;left:7px;top:-28px;border:3px solid #222}
#player:after{content:"";position:absolute;left:7px;right:7px;bottom:-15px;height:18px;border-bottom:7px solid #222;border-left:5px solid transparent;border-right:5px solid transparent}
.obstacle{position:absolute;z-index:8;bottom:24%;width:46px;height:60px;background:#e53935;border:4px solid #fff;border-radius:8px;box-shadow:0 4px 10px #0008}
.coin{position:absolute;z-index:9;bottom:35%;width:30px;height:30px;border-radius:50%;background:#ffd21a;border:4px solid #fff35a;box-shadow:0 0 12px #ffdf00}
#warning{position:absolute;z-index:30;top:24%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;color:#ff3030;text-shadow:3px 3px #000;opacity:0;pointer-events:none}
#menu,#gameover{position:absolute;z-index:50;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.panel{width:min(440px,94vw);background:#202020;border:2px solid #fff;border-radius:18px;padding:24px;box-shadow:0 12px 40px #000}
h1{margin:0 0 8px;font-size:40px}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;font-size:18px;font-weight:800}
.primary{background:#ffd21a;color:#111}
input{width:100%;padding:13px;border-radius:10px;border:0;font-size:17px;margin:10px 0}
#rankingList{text-align:left;max-height:220px;overflow:auto;margin-top:12px}
.rankRow{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #555}
.small{font-size:13px;color:#ccc}
.shake{animation:shake .16s linear infinite}
@keyframes shake{
0%{transform:translate(0)}
25%{transform:translate(5px,-3px)}
50%{transform:translate(-4px,3px)}
75%{transform:translate(3px,2px)}
100%{transform:translate(-2px,-2px)}
}
</style>
</head>

<div id="game">

<div id="sky"></div>

</div>

</p>

placeholder="名前"

</div>
