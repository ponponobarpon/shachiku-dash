<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>社畜ダッシュ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;touch-action:none}
#game{position:relative;width:138.89vw;height:138.89dvh;left:-19.445vw;top:-19.445dvh;transform:scale(.72);transform-origin:center center;overflow:hidden;background:#9ed8f5;will-change:transform}
.sky{position:absolute;inset:0 0 45%;background:linear-gradient(#62bdf7 0%,#bde9ff 62%,#f4d6ad 100%);z-index:0}
.city{position:absolute;left:0;bottom:42%;width:300%;height:30%;z-index:1;opacity:.9;background:repeating-linear-gradient(90deg,#9da8b0 0 7vw,#c9d0d5 7vw 10vw,#8997a1 10vw 16vw,#b8c1c7 16vw 21vw);will-change:transform}
.city:before{content:"";position:absolute;inset:35% 0 0;background:repeating-linear-gradient(90deg,transparent 0 12vw,#f5c84b 12vw 12.6vw,transparent 12.6vw 24vw);opacity:.65}
.road{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(#777b7e 0 7%,#4e5052 7% 100%);border-top:8px solid #858585;z-index:2;overflow:hidden}
.lane{position:absolute;bottom:48%;left:0;width:300%;height:9px;background:repeating-linear-gradient(90deg,transparent 0 35px,#eee 35px 105px,transparent 105px 175px);opacity:.8;will-change:transform}
#game:after{content:"";position:absolute;left:0;right:0;bottom:45%;height:8%;z-index:3;background:repeating-linear-gradient(90deg,#f4f4f4 0 22px,transparent 22px 82px);opacity:.45;will-change:transform}
.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;z-index:30;flex-wrap:wrap}
.hudBox{background:#08141ce8;border:2px solid #fff;border-radius:10px;color:#fff;padding:6px 10px;font-weight:800;min-width:92px;text-align:center;box-shadow:0 3px 8px #0008}
.hudBox small{display:block;font-size:10px;opacity:.8}.hudBox b{font-size:18px}
#warning{position:absolute;top:21%;left:50%;transform:translateX(-50%);z-index:40;background:#e53935;color:#fff;border:3px solid #fff;border-radius:12px;padding:8px 18px;font-weight:900;font-size:22px;opacity:0;pointer-events:none;box-shadow:0 5px 18px #0008}
#warning.show{opacity:1;animation:pulse .35s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}
#boss{position:absolute;z-index:14;left:-120px;bottom:24%;width:105px;height:105px;border-radius:50%;overflow:hidden;border:4px solid #222;background:#ddd;box-shadow:0 5px 15px #0009;will-change:left,transform}
#boss img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}.bossFace{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:50%;opacity:0;transition:.15s}.bossFace:before,.bossFace:after{content:"";position:absolute;top:34%;width:18px;height:5px;background:#b71c1c;border-radius:8px;box-shadow:0 0 5px #fff8}.bossFace:before{left:22%;transform:rotate(18deg)}.bossFace:after{right:22%;transform:rotate(-18deg)}#boss.angry .bossFace{opacity:.72}#boss.pressed .bossFace{opacity:1;filter:drop-shadow(0 0 5px #f00)}
#player{position:absolute;z-index:20;left:40%;bottom:24%;width:52px;height:72px;will-change:transform}
.head{position:absolute;left:7px;top:-25px;width:38px;height:38px;border-radius:50%;background:#f1c7a5;border:2px solid #222}
.body{position:absolute;left:0;top:24px;width:52px;height:48px;background:#26364b;border-radius:12px 12px 8px 8px;border:2px solid #111}
.faceEye{position:absolute;top:13px;width:5px;height:5px;background:#222;border-radius:50%}.e1{left:11px}.e2{right:11px}
.mouth{position:absolute;left:12px;top:27px;width:16px;height:7px;border-bottom:2px solid #222;border-radius:50%;transition:.15s}.sweat{position:absolute;right:-5px;top:5px;width:7px;height:13px;background:#39a9ff;border-radius:70% 30% 70% 30%;opacity:0;transition:.15s}.sweating .sweat{opacity:1}.panicked .mouth{height:13px;border:2px solid #222;border-radius:50%}.happy .mouth{height:9px;border-bottom:4px solid #222}.eyesWide .faceEye{width:7px;height:7px}.tired .mouth{border-bottom:0;border-top:2px solid #222}
.arm{position:absolute;top:38px;width:10px;height:32px;background:#26364b;border:2px solid #111;border-radius:10px}.a1{left:-1px;transform:rotate(15deg)}.a2{right:-1px;transform:rotate(-15deg)}
.leg{position:absolute;top:67px;width:13px;height:22px;background:#202733;border-radius:8px}.l1{left:17px}.l2{right:17px}
#obstacles{position:absolute;inset:0;z-index:12;pointer-events:none}
.ob{position:absolute;bottom:24%;width:52px;height:62px;border-radius:10px;background:#ff9f1c;border:4px solid #fff;box-shadow:0 4px 10px #0008}
.ob::after{content:"!";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:1000}.ob.cone{background:#ff7b00}.ob.bike{background:#27ae60}.ob.sign{background:#e53935}.ob.bench{background:#8d5a35}.ob.car{background:#2878d0}.ob.bike::after{content:"🚲";font-size:26px}.ob.sign::after{content:"⚠"}.ob.bench::after{content:"🪑"}.ob.car::after{content:"🚗"}
.coin{position:absolute;bottom:35%;width:34px;height:34px;border-radius:50%;background:#ffd21c;border:4px solid #fff;box-shadow:0 3px 10px #0008;display:grid;place-items:center;color:#8a5b00;font-weight:1000;font-size:17px}
#pauseBtn{position:absolute;right:0;top:0;width:48px;height:48px;margin:0;padding:0;border:2px solid #fff;border-radius:12px;background:#111d;color:#fff;font-size:22px;font-weight:1000;z-index:80}#pauseBtn:active{transform:scale(.94)}
#milestone,#powerupMessage{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:45;color:#fff;font-weight:1000;text-align:center;text-shadow:0 3px 7px #000;pointer-events:none;opacity:0}#milestone{top:38%;font-size:30px}#powerupMessage{top:48%;font-size:20px}#milestone.show,#powerupMessage.show{animation:popMsg .9s ease-out forwards}@keyframes popMsg{0%{opacity:0;transform:translate(-50%,-35%) scale(.65)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-72%) scale(1)}}
.powerup{position:absolute;bottom:29%;width:42px;height:42px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;font-size:23px;font-weight:1000;box-shadow:0 4px 12px #0009;z-index:13;animation:powerFloat .55s ease-in-out infinite alternate}.powerup.shield{background:#2d9cdb}.powerup.slow{background:#9b59b6}.powerup.coffee{background:#8d5a35}@keyframes powerFloat{to{transform:translateY(-9px) rotate(8deg)}}
#game.paused .commuterTrain,#game.paused .crosswalk,#game.paused .ped{animation-play-state:paused}
#overlay{position:absolute;inset:0;z-index:60;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:min(92vw,430px);background:#fff;border:4px solid #111;border-radius:18px;padding:20px;box-shadow:0 10px 35px #000b;text-align:center}
.panel h1{margin:0 0 4px;font-size:34px}.panel p{margin:5px 0 15px}
#playerName{width:100%;padding:13px;border:2px solid #222;border-radius:10px;font-size:18px;text-align:center}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-size:20px;font-weight:900}
#ranking{margin-top:14px;text-align:left;background:#f1f1f1;border-radius:10px;padding:10px}
.rankRow{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid #ccc}.rankRow:last-child{border-bottom:0}
#gameoverStats{font-weight:800;margin-top:8px}#hint{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);z-index:35;color:#fff;text-shadow:0 2px 4px #000;font-size:13px;white-space:nowrap}
.shake{animation:shake .18s linear 3}@keyframes shake{25%{transform:translate(7px,0)}50%{transform:translate(-7px,0)}75%{transform:translate(5px,0)}}
.hidden{display:none!important}


/* ===== COMPLETE POLISH PASS ===== */
#multiplier,#phase{font-size:16px}
#bossEyes{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.0;transition:.12s}
#bossEyes i{position:absolute;top:35%;width:12px;height:7px;background:#111;border-radius:50%;box-shadow:0 0 0 2px #fff6}
#bossEyes i:first-child{left:25%}.bossEyes i:last-child{right:25%}
#bossMouth{position:absolute;z-index:4;left:38%;top:57%;width:24%;height:9px;border-bottom:4px solid #111;border-radius:0 0 18px 18px;opacity:0;pointer-events:none}
#boss.angry #bossEyes{opacity:1}.bossMouth{transition:.12s}.bossFace+.bossEyes{}
#boss.pressed #bossMouth{opacity:1;border-bottom-color:#b40000;transform:scaleY(1.5)}
#boss.angry .bossMouth{opacity:.9}
.busStop{position:absolute;z-index:6;bottom:39%;left:78%;width:56px;height:72px;border-left:5px solid #333;border-top:5px solid #333;border-radius:10px 10px 0 0;font-size:9px;font-weight:900;text-align:center;padding-top:5px;color:#333}
.tree{position:absolute;z-index:6;bottom:39%;width:34px;height:65px;background:#5b3b24;border-radius:8px}.tree:before{content:"";position:absolute;left:-18px;top:-34px;width:70px;height:60px;background:#4b8f45;border-radius:50%}.t1{left:8%}.t2{left:53%}
#player:after{content:"";position:absolute;left:5px;bottom:-5px;width:46px;height:8px;border-radius:50%;background:#0004;filter:blur(2px);z-index:-1}
.ob.puddle{background:#287fc2}.ob.barrier{background:#e67e22}.ob.person{background:#6c5ce7}
.ob.puddle::after{content:"💧"}.ob.barrier::after{content:"🚧"}.ob.person::after{content:"🚶"}
.coin{animation:coinFloat .65s ease-in-out infinite alternate}@keyframes coinFloat{to{transform:translateY(-7px) rotate(12deg)}}
#warning{font-weight:1000;text-shadow:0 2px 5px #000;letter-spacing:.04em}

/* ===== FULL GAME UPDATE ===== */
.commuterTrain{position:absolute;z-index:5;left:-300px;bottom:39%;width:260px;height:60px;background:#f4f4f4;border:4px solid #333;border-radius:9px;box-shadow:0 5px 12px #0007;animation:trainRun 10s linear infinite}.commuterTrain:before{content:"";position:absolute;left:14px;top:11px;width:38px;height:25px;background:#74c8ec;box-shadow:48px 0 #74c8ec,96px 0 #74c8ec,144px 0 #74c8ec;border:2px solid #555}.commuterTrain:after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:7px;background:#333}@keyframes trainRun{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 650px))}}
.crosswalk{position:absolute;z-index:4;bottom:17%;left:-280px;width:230px;height:78px;transform:skewX(-20deg);background:repeating-linear-gradient(90deg,#eee 0 22px,transparent 22px 40px);opacity:.55;animation:crossRun 7.5s linear infinite}@keyframes crossRun{from{transform:translateX(0) skewX(-20deg)}to{transform:translateX(135vw) skewX(-20deg)}}
.ped{position:absolute;z-index:7;bottom:39%;width:18px;height:48px;background:#222;border-radius:10px 10px 3px 3px;animation:pedRun 8.5s linear infinite}.ped:before{content:"";position:absolute;left:3px;top:-13px;width:12px;height:12px;border-radius:50%;background:#f0c7a8}.ped.p1{left:20%;animation-delay:-2s}.ped.p2{left:65%;animation-delay:-5s}@keyframes pedRun{from{transform:translateX(0)}to{transform:translateX(-130vw)}}

#bossMood{position:absolute;z-index:2;right:10px;top:8px;font-size:34px;opacity:0;transform:rotate(-10deg) scale(.8);transition:.12s;text-shadow:2px 2px 4px #000}
#boss.angry #bossMood{opacity:1;transform:rotate(-10deg) scale(1)}
#boss.pressed #bossMood{content:"";opacity:1;transform:rotate(-5deg) scale(1.25)}
#game{background:linear-gradient(#9fd8f5 0 50%,#cfd7da 50% 54%,#303336 54% 100%)}
.sky{background:linear-gradient(#9fd8f5 0%,#eaf7fb 78%,#fff1d0 100%)}
.city{background-size:220% 100%;animation:none;will-change:transform}
.city:after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;background:repeating-linear-gradient(90deg,transparent 0 24px,#f6d56a 24px 31px,transparent 31px 70px);opacity:.35}
#road{box-shadow:inset 0 7px 0 #8a8f92}
.lane{width:200%;will-change:transform}
#player{left:39%;bottom:18%;width:78px;height:112px;will-change:transform;filter:drop-shadow(0 6px 5px #0007)}
#player.running .leg{animation:runLeg .18s linear infinite alternate}
#player.running .arm{animation:runArm .18s linear infinite alternate}
@keyframes runLeg{to{transform:translateY(-5px) rotate(12deg)}}
@keyframes runArm{to{transform:translateY(4px) rotate(-12deg)}}
.head{transition:transform .12s}
#player.panicked .head{transform:scale(1.08) rotate(-5deg)}
#player.happy .head{transform:scale(1.04) rotate(3deg)}
#player.tired .head{transform:rotate(2deg)}
.sweat{display:none;position:absolute;right:-4px;top:4px;width:9px;height:15px;background:#45a9ff;border-radius:70% 25% 70% 70%;transform:rotate(25deg)}
#player.sweating .sweat,#player.panicked .sweat{display:block;animation:sweat .55s ease-in-out infinite alternate}
@keyframes sweat{to{transform:translateY(5px) rotate(25deg)}}
#boss{left:auto;right:-330px;bottom:19%;width:210px;height:300px;will-change:left,transform}
#boss.angry{transform:scale(1.05) rotate(-1deg);filter:saturate(1.25) contrast(1.1) drop-shadow(0 0 10px #f00)}
#boss.pressed{transform:scale(1.10);filter:saturate(1.4) contrast(1.2) drop-shadow(0 0 18px #f00)}
#boss:after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;background:radial-gradient(circle at 50% 28%,transparent 0 24%,rgba(255,0,0,.0) 25% 100%);transition:.15s}
#boss.angry:after{background:radial-gradient(circle at 50% 28%,rgba(255,40,40,.18),transparent 48%)}
.ob{bottom:18%;transition:transform .08s}
.ob.bike{background:#263238}.ob.sign{background:#ffd21c}.ob.bench{background:#8b5a2b}.ob.car{background:#d32f2f}.ob.cone{background:#f27622}
.ob.bike::after{content:"🚲"}.ob.sign::after{content:"⚠"}.ob.bench::after{content:"🪑"}.ob.car::after{content:"🚗"}.ob.cone::after{content:"🚧"}
.coin{bottom:30%;animation:coinSpin .7s linear infinite;will-change:transform}
@keyframes coinSpin{50%{transform:scaleX(.55)}100%{transform:scaleX(1)}}
#warning.show{animation:pulse .32s infinite alternate}
#hint{background:#0008;padding:5px 10px;border-radius:10px}
@media (max-width:600px){#player{left:38%;bottom:18%;transform-origin:center bottom}#boss{width:180px;height:258px;bottom:18%}.hudBox{min-width:72px;padding:5px 7px}.hudBox b{font-size:16px}}


/* FINAL BOSS FACE CUTOUT FIX */
#boss{left:-120px;bottom:24%;width:125px;height:150px;border-radius:0;overflow:visible;border:0;background:transparent;box-shadow:none;will-change:left,transform}
#boss img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;border:0;border-radius:0;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))}
#boss .bossFace,#boss .bossEyes,#boss .bossMouth{display:none}
#bossMood{z-index:8;right:-4px;top:0;font-size:30px}
@media (max-width:600px){#boss{width:125px!important;height:150px!important;bottom:18%}}

/* ===== BOSS PHOTO FINAL OVERRIDE ===== */
#boss{
  position:absolute !important;
  z-index:16 !important;
  left:-180px;
  bottom:28% !important;
  width:125px !important;
  height:125px !important;
  border:0 !important;
  border-radius:0 !important;
  overflow:visible !important;
  background:transparent !important;
  box-shadow:none !important;
  will-change:left,transform;
}
#boss img,#boss #bossImg{
  display:block !important;
  width:100% !important;
  height:100% !important;
  object-fit:contain !important;
  object-position:center !important;
  border:0 !important;
  border-radius:0 !important;
  background:transparent !important;
  box-shadow:none !important;
}
#bossMood,#bossEyes,#bossMouth{display:none !important}
@media (max-width:600px){#boss{width:125px !important;height:125px !important;bottom:28% !important}}
</style>
</head>

function startGame(){
playerName.value=(playerName.value.trim()||"社畜").slice(0,12);
running=true;last=performance.now();distance=0;coins=0;combo=0;bestCombo=0;speed=START_SPEED;
playerY=0;vy=0;jumping=false;bossGap=38;elapsed=0;nextObstacle=2;nextCoin=.9;safeUntil=performance.now()+1200;

}
function endGame(){
if(!running)return;running=false;endScheduled=false;isPressing=false;longJumpTriggered=false;lastMilestone=0;nearMisses=0;paused=false;countdown=3;shield=0;slowTimer=0;coffeeTimer=0;nextPowerup=7;game.classList.remove("paused");pauseBtn.textContent="Ⅱ";if(pressTimer){clearTimeout(pressTimer);pressTimer=0}player.classList.remove("running");cancelAnimationFrame(raf);
const finalMultiplier=Math.min(5,1+Math.floor(bestCombo/5));if(distance>bestDistance){bestDistance=Math.floor(distance);localStorage.setItem("shachikuBestDistance",bestDistance)}bestEl.textContent=bestDistance+"m";const score=Math.floor((distance*10+coins*100+bestCombo*50)*finalMultiplier);
gameoverStats.innerHTML=`距離 ${Math.floor(distance)}m ／ コイン ${coins} ／ 最大COMBO ${bestCombo} ／ 倍率 ×${finalMultiplier} ／ スコア ${score.toLocaleString()}`;
gameoverStats.classList.remove("hidden");overlay.classList.remove("hidden");hint.classList.add("hidden");

}
async function submitScore(score){
try{const r=push(ref(db,"scores"));await set(r,{name:playerName.value.trim()||"社畜",score,distance:Math.floor(distance),coins,combo:bestCombo,createdAt:Date.now()})}
catch(e){console.error("ランキング保存失敗",e)}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function loadRanking(){
try{
const snap=await get(ref(db,"scores"));
if(!snap.exists()){rankingList.innerHTML="<div style='padding-top:6px'>まだランキングがありません</div>";return}
const rows=[];snap.forEach(c=>rows.push(c.val()));rows.sort((a,b)=>Number(b.score||0)-Number(a.score||0));
rankingList.innerHTML=rows.slice(0,10).map((x,i)=>`<div class="rankRow"><span>${i+1}位　${escapeHtml(x.name||"社畜")}</span><b>${Number(x.score||0).toLocaleString()}</b></div>`).join("")
}catch(e){console.error("ランキング取得失敗",e);rankingList.innerHTML="<div style='padding-top:6px'>ランキング取得失敗</div>"}
}
function jump(high){
if(!running)return;
if(!jumping){jumping=true;vy=high?980:650;safeUntil=performance.now()+1400}else if(high)vy=Math.max(vy,820)
}
let pressTimer=null,isPressing=false;

game.addEventListener("pointerup",e=>{if(!running||e.target.closest("#overlay"))return;e.preventDefault();if(pressTimer){clearTimeout(pressTimer);pressTimer=0}if(isPressing&&!longJumpTriggered)jump(false);isPressing=false;longJumpTriggered=false});
game.addEventListener("pointercancel",()=>{isPressing=false;longJumpTriggered=false;if(pressTimer){clearTimeout(pressTimer);pressTimer=0}});
addEventListener("pointerup",()=>{if(!isPressing)return;if(pressTimer){clearTimeout(pressTimer);pressTimer=0}isPressing=false;longJumpTriggered=false});
addEventListener("pointercancel",()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=0}isPressing=false;longJumpTriggered=false});
game.addEventListener("contextmenu",e=>e.preventDefault());addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();jump(true)}if(e.code==="Escape"&&running){paused=!paused;game.classList.toggle("paused",paused);pauseBtn.textContent=paused?"▶":"Ⅱ";if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}}});

startBtn.addEventListener("click",startGame);

function spawnObstacle(){const types=["cone","bike","sign","bench","car","puddle","barrier","person"];const type=types[Math.floor(Math.random()*types.length)];const el=document.createElement("div");el.className="ob "+type;el.style.left=(innerWidth+80)+"px";obstacles.appendChild(el);obstacleList.push({el,x:innerWidth+80,hit:false})}
function spawnCoin(){const el=document.createElement("div");el.className="coin";el.textContent="¥";el.style.bottom=(25+Math.random()*20)+"%";el.style.left=(innerWidth+60)+"px";obstacles.appendChild(el);coinList.push({el,x:innerWidth+60,hit:false})}
function spawnPowerup(){const types=["shield","slow","coffee"];const type=types[Math.floor(Math.random()*types.length)];const el=document.createElement("div");el.className="powerup "+type;el.textContent=type==="shield"?"🛡️":type==="slow"?"⏱️":"☕";el.style.left=(innerWidth+70)+"px";obstacles.appendChild(el);powerupList.push({el,x:innerWidth+70,type,hit:false})}
function rectHit(a,b){const ap={left:a.left+7,right:a.right-7,top:a.top+6,bottom:a.bottom-2};const bp={left:b.left+5,right:b.right-5,top:b.top+5,bottom:b.bottom};return ap.left<bp.right&&ap.right>bp.left&&ap.top<bp.bottom&&ap.bottom>bp.top}
function updateHUD(){const mult=Math.min(5,1+Math.floor(combo/5));distanceEl.textContent=Math.floor(distance)+"m";speedEl.textContent=(speed*3.6).toFixed(1)+"km/h";coinsEl.textContent=coins;comboEl.textContent=combo;bossDistanceEl.textContent=Math.max(0,bossGap).toFixed(0)+"m";multiplierEl.textContent="×"+mult;const d=Math.floor(distance);phaseEl.textContent=d<80?"朝":d<180?"通勤":d<300?"修羅場":"限界"}

function setPlayerFace(){player.classList.remove(...playerFaces);let f=playerFaces[Math.floor(Math.random()*playerFaces.length)];if(bossGap<12)f="panicked";else if(jumping)f="sweating";player.classList.add(f)}
function updateScene(dt){roadOffset=(roadOffset+(560+speed*145)*dt)%560;cityOffset=(cityOffset+(55+speed*16)*dt)%280;document.querySelector(".lane").style.transform=`translateX(${-roadOffset}px)`;document.querySelector(".city").style.transform=`translateX(${-cityOffset}px)`;runPhase+=dt*speed*7;player.style.marginBottom=(Math.sin(runPhase)*1.5)+"px"}
function loop(now){
if(!running)return;
const dt=Math.min(.032,(now-last)/1000);last=now;if(paused)return;elapsed+=dt;

speed=Math.min(MAX_SPEED,START_SPEED+distance*.0105);if(coffeeTimer>0)speed=Math.min(MAX_SPEED,speed+.65);if(slowTimer>0)speed*=.62;distance+=speed*dt;

const bossApproach=.34+Math.min(distance/260,.55);bossGap=Math.max(0,bossGap-bossApproach*dt);const playerX=innerWidth*.39;const bossX=playerX-(bossGap*8.0)-108;boss.style.left=Math.max(-65,bossX)+"px";
if(bossGap<15){boss.classList.add("angry");bossMood.textContent=bossGap<6?"🤬":"😠";warning.classList.add("show");if(bossGap<3){game.classList.add("shake");setTimeout(()=>game.classList.remove("shake"),220);if(!endScheduled){endScheduled=true;setTimeout(endGame,180)}return}}else {warning.classList.remove("show");boss.classList.remove("angry","pressed");bossMood.textContent="😠"}
if(bossGap<6){boss.classList.add("pressed");bossMood.textContent="🤬"}

coinList.forEach(c=>{c.x-=(185+speed*38)*dt;c.el.style.left=c.x+"px";if(!c.hit&&rectHit(playerRect,c.el.getBoundingClientRect())){c.hit=true;coins++;combo++;bestCombo=Math.max(bestCombo,combo);safeUntil=Math.max(safeUntil,performance.now()+1100);player.classList.remove(...playerFaces);player.classList.add("happy");faceTimer=1.4;comboEl.textContent=combo;multiplierEl.textContent="×"+Math.min(5,1+Math.floor(combo/5));c.el.remove()}});
