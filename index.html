<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>社畜ダッシュ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#78c9ff 0 55%,#d8d8d8 55%)}
#sky{position:absolute;inset:0 0 45%;background:linear-gradient(#6fc5ff,#d9f3ff);}
#road{position:absolute;left:0;right:0;bottom:0;height:45%;background:#555;border-top:8px solid #777}
.lane{position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 35px,#eee 35px 75px);opacity:.7;top:50%}
#hud{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:800;text-shadow:2px 2px #000}
#boss{position:absolute;z-index:7;left:-120px;bottom:24%;width:105px;height:105px;border-radius:50%;overflow:hidden;border:4px solid #222;background:#fff;box-shadow:0 5px 15px #0008;transition:none}
#boss img{width:100%;height:100%;object-fit:cover;display:block}
#player{position:absolute;z-index:10;left:40%;bottom:24%;width:52px;height:72px;background:#1769aa;border-radius:16px 16px 8px 8px;box-shadow:0 4px 8px #0008}
#player:before{content:"";position:absolute;width:38px;height:38px;background:#f0c7a8;border-radius:50%;left:7px;top:-28px;border:3px solid #222}
#player:after{content:"";position:absolute;left:7px;right:7px;bottom:-15px;height:18px;border-bottom:7px solid #222;border-left:5px solid transparent;border-right:5px solid transparent}
.obstacle{position:absolute;z-index:8;bottom:24%;width:46px;height:60px;background:#e53935;border:4px solid #fff;border-radius:8px;box-shadow:0 4px 10px #0008}
.coin{position:absolute;z-index:9;bottom:35%;width:30px;height:30px;border-radius:50%;background:#ffd21a;border:4px solid #fff35a;box-shadow:0 0 12px #ffdf00}
#warning{position:absolute;z-index:30;top:24%;left:0;right:0;text-align:center;font-size:28px;font-weight:900;color:#ff3030;text-shadow:3px 3px #000;opacity:0;pointer-events:none}
#menu,#gameover{position:absolute;z-index:50;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.panel{width:min(440px,94vw);background:#202020;border:2px solid #fff;border-radius:18px;padding:24px;box-shadow:0 12px 40px #000}
h1{margin:0 0 8px;font-size:40px}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:12px;font-size:18px;font-weight:800}
.primary{background:#ffd21a;color:#111}
input{width:100%;padding:13px;border-radius:10px;border:0;font-size:17px;margin:10px 0}
#rankingList{text-align:left;max-height:220px;overflow:auto;margin-top:12px}
.rankRow{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #555}
.small{font-size:13px;color:#ccc}
.shake{animation:shake .16s linear infinite}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(5px,-3px)}50%{transform:translate(-4px,3px)}75%{transform:translate(3px,2px)}100%{transform:translate(-2px,-2px)}}
</style>
</head>

<div id="game">
<div id="sky"></div><div id="road"><div class="lane"></div></div>
<div id="hud"><span>距離 <b id="distance">0</b>m</span><span>🪙 <b id="coins">0</b>　🔥 <b id="combo">0</b></span></div>
<div id="warning">⚠ 上司が近い！ ⚠</div>
<div id="boss"><img id="bossImg" alt="上司"></div>
<div id="player"></div>
<div id="menu"><div class="panel"><h1>社畜ダッシュ</h1><p>上司から逃げ続けろ。</p><p class="small">タップ：ジャンプ<br>長押し：大ジャンプ</p><input id="playerName" maxlength="12" value="社畜" placeholder="名前"><button class="primary" id="startBtn">スタート</button><h2>ランキング</h2><div id="rankingList">読み込み中...</div></div></div>
<div id="gameover" style="display:none"><div class="panel"><h1>GAME OVER</h1><p id="result"></p><button class="primary" id="retryBtn">もう一度</button><h2>ランキング</h2><div id="rankingList2"></div></div></div>
</div>

const game=document.getElementById("game"),player=document.getElementById("player"),boss=document.getElementById("boss");
const distanceEl=document.getElementById("distance"),coinsEl=document.getElementById("coins"),comboEl=document.getElementById("combo");
const menu=document.getElementById("menu"),over=document.getElementById("gameover"),warning=document.getElementById("warning");
const result=document.getElementById("result"),rankingList=document.getElementById("rankingList"),rankingList2=document.getElementById("rankingList2");
const playerName=document.getElementById("playerName");

let running=false,last=0,distance=0,coins=0,combo=0,bestCombo=0,speed=2.5,bossGap=38;
let jumpY=0,vy=0,obstacles=[],coinItems=[],spawnTimer=2.4,safeUntil=0,warningTimer=0;
const START_SPEED=2.5,MAX_SPEED=4.0,GROUND=24;

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

async function loadRanking(target=rankingList){
 try{
  const snap=await get(ref(db,"scores"));
  if(!snap.exists()){target.textContent="まだランキングがありません";return;}
  const rows=[];snap.forEach(c=>rows.push(c.val()));
  rows.sort((a,b)=>Number(b.score||0)-Number(a.score||0));
  target.innerHTML="";
  rows.slice(0,10).forEach((x,i)=>{
   const r=document.createElement("div");r.className="rankRow";
   r.innerHTML=`<span>${i+1}位　${escapeHtml(x.name||"社畜")}</span><b>${Number(x.score||0).toLocaleString()}</b>`;
   target.appendChild(r);
  });
 }catch(e){console.error(e);target.textContent="ランキング取得失敗";}
}
async function submitScore(score){
 try{const r=push(ref(db,"scores"));await set(r,{name:playerName.value.trim()||"社畜",score,distance:Math.floor(distance),coins,combo:bestCombo,createdAt:Date.now()});}catch(e){console.error(e);}
}

function reset(){
 document.querySelectorAll(".obstacle,.coin").forEach(e=>e.remove());
 obstacles=[];coinItems=[];distance=0;coins=0;combo=0;bestCombo=0;speed=START_SPEED;bossGap=38;jumpY=0;vy=0;spawnTimer=2.4;safeUntil=performance.now()+1000;
 player.style.bottom=GROUND+"%";boss.style.left="-120px";game.classList.remove("shake");
 distanceEl.textContent="0";coinsEl.textContent="0";comboEl.textContent="0";
}
function start(){
 reset();menu.style.display="none";over.style.display="none";running=true;last=performance.now();requestAnimationFrame(loop);
}
function end(){
 running=false;
 const score=Math.floor(distance*10+coins*100+bestCombo*20);
 result.innerHTML=`距離 <b>${Math.floor(distance)}m</b><br>コイン ${coins}枚　ベストコンボ ${bestCombo}<br><strong>スコア ${score.toLocaleString()}</strong>`;
 over.style.display="flex";submitScore(score);loadRanking(rankingList2);
}
function jump(power){
 if(jumpY<=0){vy=power;safeUntil=performance.now()+1400;}
}
function spawnObstacle(){
 if(performance.now()<safeUntil)return;
 const e=document.createElement("div");e.className="obstacle";e.style.left="105%";game.appendChild(e);
 obstacles.push({el:e,x:window.innerWidth+60});
}
function spawnCoin(){
 const e=document.createElement("div");e.className="coin";e.style.left="105%";e.style.bottom=(31+Math.random()*18)+"%";game.appendChild(e);
 coinItems.push({el:e,x:window.innerWidth+40,y:parseFloat(e.style.bottom)});
}
function hit(a,b){
 const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
 return ar.left<br.right-6&&ar.right>br.left+6&&ar.top<br.bottom-8&&ar.bottom>br.top+8;
}
function loop(now){
 if(!running)return;
 const dt=Math.min(.035,(now-last)/1000);last=now;
 speed=Math.min(MAX_SPEED,START_SPEED+distance*.006);
 distance+=speed*dt;
 distanceEl.textContent=Math.floor(distance);
 speedText();
 jumpY+=vy*dt;vy-=18*dt;
 if(jumpY<0){jumpY=0;vy=0;}
 player.style.transform=`translateY(${-jumpY*7}px)`;
 spawnTimer-=dt;
 if(spawnTimer<=0){
  if(Math.random()<.72)spawnObstacle();else spawnCoin();
  spawnTimer=1.9+Math.random()*1.3;
 }
 if(Math.random()<dt*.55&&performance.now()>safeUntil)spawnCoin();

 const px=window.innerWidth*.40;
 obstacles=obstacles.filter(o=>{
  o.x-=speed*80*dt;o.el.style.left=o.x+"px";
  if(o.x<-80){o.el.remove();return false;}
  if(hit(player,o.el)&&jumpY<45){combo=0;comboEl.textContent=0;end();return false;}
  return true;
 });
 coinItems=coinItems.filter(c=>{
  c.x-=speed*80*dt;c.el.style.left=c.x+"px";
  if(c.x<-60){c.el.remove();return false;}
  if(hit(player,c.el)){coins++;combo++;bestCombo=Math.max(bestCombo,combo);coinsEl.textContent=coins;comboEl.textContent=combo;c.el.remove();safeUntil=performance.now()+1100;return false;}
  return true;
 });

 bossGap-=Math.max(0,(speed-2.1))*dt*.45;
 const gapPx=Math.max(-40,bossGap*9);
 boss.style.left=(px-gapPx-105)+"px";
 if(bossGap<10){warning.style.opacity=1;warningTimer=.15;game.classList.add("shake");}
 else if(warningTimer<=0){warning.style.opacity=0;game.classList.remove("shake");}
 warningTimer-=dt;
 if(bossGap<3){end();return;}
 requestAnimationFrame(loop);
}
